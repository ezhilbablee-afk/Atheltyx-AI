version: '3.8'

services:
  athelytix-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: athelytix_sports_ai
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    environment:
      - ENV=production
      - PORT=8080
